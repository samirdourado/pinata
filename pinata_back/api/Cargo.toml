[package]
name = "pinata-api"
version = "0.1.0"
description = "Pinata HTTP API: wallet sign-in, posts, comments paid on Solana, votes and Piñatas"
edition = "2021"
publish = false

[dependencies]
# The program as a library: account layouts, instruction formats and addresses
pinata = { path = "../programs/pinata", features = ["no-entrypoint"] }
anchor-lang = "1.2.2"

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Wallet sign-in: ed25519 signatures, base58 addresses, random tokens
ed25519-dalek = "2"
bs58 = "0.5"
rand = "0.8"
sha2 = "0.10"

# Solana RPC: on-chain Piñatas and payment checks
solana-rpc-client = "3.1"
solana-rpc-client-api = "3.1"
solana-commitment-config = "3"
solana-signature = "3"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"
solana-transaction-status-client-types = "3.1"
