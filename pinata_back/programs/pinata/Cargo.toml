[package]
name = "pinata"
version = "0.1.0"
description = "Pinata: paid comments, creator and platform prize pools (Piñatas) with verifiable draws"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pinata"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
# MagicBlock verifiable randomness (VRF): only the request/callback helpers, no rollups
ephemeral-vrf-sdk = { version = "=0.17.3", features = ["anchor"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
solana-clock = "3"
solana-signature = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
