[package]
name = "pinata-cli"
version = "0.1.0"
description = "Command line client for the Pinata program on Devnet: initialize, status and a draw with the real VRF oracle"
edition = "2021"
publish = false

[[bin]]
name = "pinata-cli"
path = "src/main.rs"

[dependencies]
# no-entrypoint: use the program as a library (accounts, instructions, state)
pinata = { path = "../programs/pinata", features = ["no-entrypoint"] }
anchor-lang = "1.2.2"
ephemeral-vrf-sdk = { version = "=0.17.3", features = ["anchor"] }
solana-rpc-client = "3.1"
solana-commitment-config = "3"
solana-keypair = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.2"
# api-demo: talks to the API like the web app will
reqwest = { version = "0.12", features = ["blocking", "json", "cookies"] }
serde_json = "1"
bs58 = "0.5"
